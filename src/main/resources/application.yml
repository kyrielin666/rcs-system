spring:
  application:
    name: rcs-system

  # PostgreSQL 数据源
  datasource:
    url: jdbc:postgresql://localhost:5432/rcs_system
    username: rcs
    password: rcs
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password:

server:
  port: 8080
